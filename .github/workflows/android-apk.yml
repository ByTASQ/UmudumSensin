name: Android APK

on:
  push:
    branches:
      - perf/optimize-match-trigger
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager bulunamadi. Android SDK: $SDK_ROOT"
            find "$SDK_ROOT" -maxdepth 4 -type f -name "sdkmanager*" -print || true
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install

      - name: Build web app
        env:
          VITE_API_BASE_URL: https://umudum-sensin-api.onrender.com
        run: npm run build

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.umudumsensin.isaraman',
            appName: 'Umudum Sensin',
            webDir: 'dist',
            bundledWebRuntime: false,
          };

          export default config;
          EOF

      - name: Sync Android
        run: npx cap sync android

      - name: Prepare Gradle distribution
        working-directory: android
        run: |
          chmod +x gradlew
          # GitHub-hosted Gradle distribution URL bazen 504 verebiliyor.
          # Wrapper'ı doğrudan services.gradle.org dağıtımına yönlendir.
          sed -i 's#https://github.com/gradle/gradle-distributions/releases/download/\([^/]*/\)\([^/]*\)#https://services.gradle.org/distributions/\2#' gradle/wrapper/gradle-wrapper.properties
          # Tam Gradle paketi yerine daha küçük binary dağıtımı kullan.
          sed -i 's/gradle-8.14.3-all.zip/gradle-8.14.3-bin.zip/' gradle/wrapper/gradle-wrapper.properties
          sed -i 's/networkTimeout=10000/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties
          grep 'distributionUrl' gradle/wrapper/gradle-wrapper.properties

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          for attempt in 1 2 3; do
            ./gradlew assembleDebug --no-daemon --stacktrace && exit 0
            echo "Gradle build attempt $attempt failed; retrying..."
            sleep 5
          done
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: umudum-sensin-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
